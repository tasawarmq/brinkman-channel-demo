[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brinkman-channel-demo"
version = "0.1.0"
description = "A verified pressure-driven Brinkman channel-flow example"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.scripts]
brinkman-sweep = "brinkman_channel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

